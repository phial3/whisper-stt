[package]
name = "whisper-stt"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Audio to text transcription library written in rust that utilizes whisper-rs bindings."
repository = "https://github.com/phial3/whisper-stt"
keywords = ["STT", "Speech-to-text", "whisper", "openai", "transcription"]
categories = ["multimedia::audio"]
exclude = [".github"]
# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html
# https://doc.rust-lang.org/cargo/reference/environment-variables.html

[dependencies]
reqwest = "0.13"
whisper-rs = "0.16"
tokio = { version = "1.53", features = ["full"] }
symphonia = { version = "0.6", features = ["mp3"] }
rubato = "5.0"

[dev-dependencies]
anyhow = "1"
hf-hub = "1.0"
ctrlc = "3.5"
cpal = "0.18"
hound = "3.5"
rodio = "0.22"
voice-engine = "0.3"
# Blocked: `flexaudio` 0.2 depends on `cpal` 0.16, whose ALSA backend pulls in
# `alsa-sys`, and cargo will not let two packages claim the same `links = "alsa"`
# in one graph. Revisit once flexaudio moves to cpal 0.18 (or drop our cpal dep).
# flexaudio = "0.2"
