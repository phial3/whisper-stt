[package]
name = "whisper-stt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Audio to text transcription library written in rust that utilizes whisper-rs bindings."
repository = "https://github.com/phial3/whisper-stt"
keywords = ["STT", "Speech-to-text", "whisper", "openai", "transcription"]
categories = ["multimedia::audio"]
exclude = [".github", "models", "recordings"]
# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html
# https://doc.rust-lang.org/cargo/reference/environment-variables.html

[features]
default = [
    "network",
    "mp3",
    "aac",
    "flac",
    "vorbis",
    "ogg",
    "mkv",
    "isomp4",
    "wav",
    "pcm",
    "metadata",
]

## Enables `ModelStore::ensure` and `ModelStore::download`: fetches checkpoints over HTTPS.
## Turn it off to drop reqwest and its TLS stack when models ship with the binary.
network = ["dep:reqwest"]

## MPEG-1/2/3 audio (`.mp3`).
mp3 = ["symphonia/mp3"]
## Advanced Audio Coding (`.aac`), usually inside `.m4a` or `.mp4`.
aac = ["symphonia/aac"]
## Free Lossless Audio Codec (`.flac`).
flac = ["symphonia/flac"]
## Vorbis audio.
vorbis = ["symphonia/vorbis"]
## Ogg container (`.ogg`, `.oga`).
ogg = ["symphonia/ogg"]
## Matroska / WebM container (`.mkv`, `.mka`, `.webm`).
mkv = ["symphonia/mkv"]
## ISO Base Media container (`.mp4`, `.m4a`, `.mov`).
isomp4 = ["symphonia/isomp4"]
## Uncompressed PCM, as stored in WAV, AIFF and CAF.
pcm = ["symphonia/pcm"]
## RIFF WAVE container (`.wav`).
wav = ["symphonia/wav"]
## Audio Interchange File Format (`.aiff`).
aiff = ["symphonia/aiff"]
## Core Audio Format (`.caf`).
caf = ["symphonia/caf"]
## Apple Lossless (`.alac`).
alac = ["symphonia/alac"]
## Adaptive Differential PCM.
adpcm = ["symphonia/adpcm"]
## ID3v1, ID3v2 and APE tag readers.
metadata = ["symphonia/all-meta"]

[dependencies]
whisper-rs = "0.16"
rubato = "5.0"
reqwest = { version = "0.13", optional = true }
symphonia = { version = "0.6", default-features = false, features = ["opt-simd"] }

[dev-dependencies]
anyhow = "1"
hf-hub = "1.0"
ctrlc = "3.5"
cpal = "0.18"
hound = "3.5"
wavers = "1.5"
chrono = "0.4"
voice-engine = "0.3"
rodio = { version = "0.22"}
tokio = { version = "1.53", features = ["full"] }
criterion = { version = "0.8", default-features = false }
# Blocked: `flexaudio` 0.2 depends on `cpal` 0.16, whose ALSA backend pulls in
# `alsa-sys`, and cargo will not let two packages claim the same `links = "alsa"`
# in one graph. Revisit once flexaudio moves to cpal 0.18 (or drop our cpal dep).
# flexaudio = "0.2"

[[bench]]
name = "audio"
harness = false