[package]
name = "whisper-stt"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Audio to text transcription library written in rust that utilizes whisper-rs bindings."
repository = "https://github.com/phial3/whisper-stt"
keywords = ["STT", "Speech-to-text", "whisper", "openai", "transcription"]
categories = ["multimedia::audio"]
exclude = [".github"]
# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html
# https://doc.rust-lang.org/cargo/reference/environment-variables.html

[dependencies]
reqwest = "0.13"
whisper-rs = "0.16"
tokio = { version = "1.53", features = ["full"] }
symphonia = { version = "0.6", features = ["mp3"] }

[dev-dependencies]
anyhow = "1"
hf-hub = "1.0"
ctrlc = "3.5"
cpal = "0.18"
hound = "3.5"
rodio = "0.22"
